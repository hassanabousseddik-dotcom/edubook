<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduBook - Gestion et réservation premium de matériel pédagogique pour établissements scolaires.">
  <title>EduBook | Réservation de Matériel Éducatif</title>
  
  <!-- Google Fonts - Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/index.css">

  <!-- HTML5 Importmap to bypass module caching aggressively -->
  <script type="importmap">
    {
      "imports": {
        "./auth.js": "/js/auth.js?v=4",
        "./components/login.js": "/js/components/login.js?v=4",
        "./components/navbar.js": "/js/components/navbar.js?v=4",
        "./router.js": "/js/router.js?v=4",
        "./store.js": "/js/store.js?v=4",
        "./supabase.js": "/js/supabase.js?v=4",
        "./utils/toast.js": "/js/utils/toast.js?v=4",
        "./components/dashboard.js": "/js/components/dashboard.js?v=4",
        "./components/catalog.js": "/js/components/catalog.js?v=4",
        "./components/reservations.js": "/js/components/reservations.js?v=4",
        "./components/adminPanel.js": "/js/components/adminPanel.js?v=4",
        "./components/profile.js": "/js/components/profile.js?v=4",
        "./utils/time.js": "/js/utils/time.js?v=4",
        "../store.js": "/js/store.js?v=4",
        "../utils/toast.js": "/js/utils/toast.js?v=4",
        "./bookingForm.js": "/js/components/bookingForm.js?v=4",
        "../utils/safeText.js": "/js/utils/safeText.js?v=4",
        "../auth.js": "/js/auth.js?v=4",
        "./navbar.js": "/js/components/navbar.js?v=4"
      }
    }
  </script>
</head>
<body>

  <!-- App Wrapper with dynamic theme-switching -->
  <div id="app">
    <!-- Navbar component will render here -->
    <header id="navbar-container"></header>

    <!-- Main Content area where pages are injected -->
    <main id="main-content" class="page-container"></main>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <!-- Lucide Icons CDN for sleek, modern icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Entry script (modern modular JS) -->
  <script type="module" src="/js/app.js?v=4"></script>
</body>
</html>
